
name: Build Tatkal Express APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q TatkalExpressPro_AndroidStudio.zip -d project
          test -f project/TatkalExpressPro_AndroidStudio/settings.gradle

      - name: Build APK
        run: |
          gradle -p project/TatkalExpressPro_AndroidStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TatkalExpressPro-APK
          path: project/TatkalExpressPro_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
